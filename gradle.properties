# JVM memory for the Gradle daemon and the Kotlin compile daemon.
# The server module is large; the Kotlin backend OOMs ("GC overhead limit
# exceeded") at the default Kotlin daemon heap, so bump it here once for
# every build (local + CI + deploy) instead of passing -P flags by hand.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx6g
